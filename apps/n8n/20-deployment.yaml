apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi5
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: n8n
        image: n8nio/n8n:2.46.6@sha256:4dc0696727175b496f7306dd98ac5fd848c7172a1f9daf68c3e2c9157edffb63
        env:
        - name: TZ
          value: Europe/Madrid
        - name: GENERIC_TIMEZONE
          value: Europe/Madrid
        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_DATABASE
          value: n8n
        - name: DB_POSTGRESDB_HOST
          value: homelab-postgres-rw.databases.svc
        - name: DB_POSTGRESDB_PORT
          value: '5432'
        - name: DB_POSTGRESDB_USER
          value: n8n_app
        - name: DB_POSTGRESDB_POOL_SIZE
          value: '5'
        - name: DB_POSTGRESDB_SSL_ENABLED
          value: 'true'
        - name: DB_POSTGRESDB_SSL_CA
          valueFrom:
            configMapKeyRef:
              name: postgresql-ca
              key: ca.crt
        - name: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
          value: 'true'
        - name: N8N_HOST
          value: n8n.bearsfamily.es
        - name: N8N_PROTOCOL
          value: https
        - name: N8N_PORT
          value: '5678'
        - name: N8N_WEBHOOK_URL
          value: https://n8n.bearsfamily.es/
        - name: N8N_EDITOR_BASE_URL
          value: https://n8n.bearsfamily.es
        - name: N8N_PROXY_HOPS
          value: '1'
        - name: N8N_SECURE_COOKIE
          value: 'true'
        - name: N8N_DIAGNOSTICS_ENABLED
          value: 'false'
        - name: N8N_VERSION_NOTIFICATIONS_ENABLED
          value: 'false'
        - name: N8N_TEMPLATES_ENABLED
          value: 'false'
        - name: N8N_PERSONALIZATION_ENABLED
          value: 'false'
        - name: N8N_EMAIL_MODE
          value: ''
        - name: N8N_COMMUNITY_PACKAGES_ENABLED
          value: 'false'
        - name: N8N_COMMUNITY_PACKAGES_PREVENT_LOADING
          value: 'true'
        - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
          value: 'true'
        - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
          value: 'true'
        - name: N8N_CONCURRENCY_PRODUCTION_LIMIT
          value: '1'
        - name: EXECUTIONS_TIMEOUT
          value: '600'
        - name: EXECUTIONS_TIMEOUT_MAX
          value: '600'
        - name: EXECUTIONS_DATA_PRUNE
          value: 'true'
        - name: EXECUTIONS_DATA_MAX_AGE
          value: '168'
        - name: EXECUTIONS_DATA_PRUNE_MAX_COUNT
          value: '1000'
        - name: EXECUTIONS_DATA_SAVE_ON_SUCCESS
          value: all
        - name: EXECUTIONS_DATA_SAVE_ON_ERROR
          value: all
        - name: N8N_RUNNERS_MODE
          value: external
        - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
          value: 127.0.0.1
        - name: N8N_DEFAULT_BINARY_DATA_MODE
          value: filesystem
        - name: NODE_OPTIONS
          value: --max-old-space-size=640
        - name: NODES_EXCLUDE
          value: '["n8n-nodes-base.code", "n8n-nodes-base.executeCommand", "n8n-nodes-base.localFileTrigger",
            "n8n-nodes-base.readWriteFile", "n8n-nodes-base.readBinaryFile", "n8n-nodes-base.writeBinaryFile"]'
        - name: NODE_EXTRA_CA_CERTS
          value: /etc/postgresql-ca/ca.crt
        envFrom:
        - secretRef:
            name: n8n-config
        ports:
        - name: http
          containerPort: 5678
        volumeMounts:
        - name: data
          mountPath: /home/node/.n8n
        - name: postgresql-ca
          mountPath: /etc/postgresql-ca
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /home/node/.cache
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /healthz/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /healthz/readiness
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: n8n-data
      - name: postgresql-ca
        configMap:
          name: postgresql-ca
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
      - name: cache
        emptyDir:
          sizeLimit: 128Mi

apiVersion: v1
kind: PersistentVolume
metadata:
  name: openclaw-local-pv
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: openclaw
    name: openclaw-home-pvc
  local:
    path: /var/lib/homelab-openclaw/state
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [pi5]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-home-pvc
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: openclaw-local-pv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw
spec:
  type: ClusterIP
  clusterIP: 10.96.208.89
  selector:
    app: openclaw
  ports:
    - name: http
      port: 18789
      targetPort: 18789
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostAliases:
        - ip: 192.168.1.163
          hostnames: [openclaw.bearsfamily.es]
      nodeSelector:
        kubernetes.io/hostname: pi5
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-config
          image: ghcr.io/openclaw/openclaw@sha256:adc5f5e9654afa3056666cb8f42415a72b91631fc301b382d5771456fee95477
          command: [sh, -ec, 'umask 077; cp /etc/openclaw/openclaw.json /home/node/.openclaw/.openclaw.json.new; mv /home/node/.openclaw/.openclaw.json.new /home/node/.openclaw/openclaw.json']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: state, mountPath: /home/node/.openclaw }
            - { name: config, mountPath: /etc/openclaw, readOnly: true }
      containers:
        - name: gateway
          image: ghcr.io/openclaw/openclaw@sha256:adc5f5e9654afa3056666cb8f42415a72b91631fc301b382d5771456fee95477
          command: [node, /app/dist/index.js, gateway, run]
          env:
            - name: HOME
              value: /home/node
            - name: OPENCLAW_CONFIG_PATH
              value: /home/node/.openclaw/openclaw.json
            - name: XDG_CACHE_HOME
              value: /home/node/.openclaw/.cache
            - name: NODE_ENV
              value: production
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: gateway-token
            - name: OPENCLAW_OLLAMA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: ollama-token
          ports:
            - containerPort: 18789
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "1", memory: 2Gi }
          startupProbe:
            exec:
              command: [node, -e, "fetch('http://127.0.0.1:18789/readyz').then(async r => process.exit(r.ok && (await r.json()).ready === true ? 0 : 1)).catch(() => process.exit(1))"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [node, -e, "fetch('http://127.0.0.1:18789/readyz').then(async r => process.exit(r.ok && (await r.json()).ready === true ? 0 : 1)).catch(() => process.exit(1))"]
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [node, -e, "fetch('http://127.0.0.1:18789/healthz').then(async r => process.exit(r.ok && (await r.json()).ok === true ? 0 : 1)).catch(() => process.exit(1))"]
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - { name: state, mountPath: /home/node/.openclaw }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: openclaw-home-pvc
        - name: config
          configMap:
            name: openclaw-config
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }

apiVersion: apps/v1
kind: Deployment
metadata:
  name: onthemanga
  namespace: onthemanga
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onthemanga
  template:
    metadata:
      labels:
        app: onthemanga
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi5
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: docker.io/homelab/onthemanga@sha256:ec0b335331673a62650b69837d54f7b0472a78775f2fa8c5a5f620779508bcec
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: cluster
        - name: JAVA_TOOL_OPTIONS
          value: -XX:MaxRAMPercentage=55.0 -XX:InitialRAMPercentage=15.0 -XX:ActiveProcessorCount=2
            -Djava.awt.headless=true -Djava.io.tmpdir=/tmp
        - name: TZ
          value: Europe/Madrid
        - name: APP_BASE_URL
          value: https://onthemanga.bearsfamily.es
        - name: APP_MAIL_FROM
          value: noreply@onthemanga.bearsfamily.es
        - name: APP_AI_URL
          value: https://onthemanga.bearsfamily.es/_ai
        - name: APP_AI_WORKER_ENABLED
          value: 'true'
        - name: APP_AI_WORKER_DELAY
          value: '1000'
        - name: APP_KNOWLEDGE_DIRECTORY
          value: /data/knowledge
        - name: APP_STORAGE_DIRECTORY
          value: /data/knowledge/objects
        - name: APP_AI_TOKEN
          valueFrom:
            secretKeyRef:
              name: onthemanga-knowledge-api
              key: ai
        - name: APP_KNOWLEDGE_IMPORT_TOKEN
          valueFrom:
            secretKeyRef:
              name: onthemanga-knowledge-api
              key: import
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: objects
          mountPath: /data/objects
        - name: tmp
          mountPath: /tmp
        - name: app-auth
          mountPath: /run/secrets/app
          readOnly: true
        - name: postgres-ca
          mountPath: /etc/postgresql-ca
          readOnly: true
        - name: knowledge
          mountPath: /data/knowledge
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          periodSeconds: 20
          failureThreshold: 3
          timeoutSeconds: 3
      volumes:
      - name: objects
        persistentVolumeClaim:
          claimName: onthemanga-objects
      - name: tmp
        emptyDir:
          sizeLimit: 512Mi
      - name: app-auth
        secret:
          secretName: onthemanga-app-auth
          defaultMode: 288
      - name: postgres-ca
        configMap:
          name: postgresql-ca
      - name: knowledge
        persistentVolumeClaim:
          claimName: onthemanga-knowledge
      terminationGracePeriodSeconds: 45

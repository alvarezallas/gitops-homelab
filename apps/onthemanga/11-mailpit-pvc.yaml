apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailpit-data
  namespace: onthemanga
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: ''
  volumeName: onthemanga-mailpit-pv
  resources:
    requests:
      storage: 1Gi

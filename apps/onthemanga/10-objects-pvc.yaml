apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: onthemanga-objects
  namespace: onthemanga
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: nfs-storage
  volumeName: onthemanga-objects-pv
  resources:
    requests:
      storage: 20Gi

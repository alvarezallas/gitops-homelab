apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whatsapp-web-data
  namespace: whatsapp
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ''
  volumeName: whatsapp-web-data-pv
  resources:
    requests:
      storage: 2Gi

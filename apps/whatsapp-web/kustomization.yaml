apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: whatsapp
resources:
- 00-namespace.yaml
- 10-pvc.yaml
- 20-deployment.yaml
- 30-service.yaml
configMapGenerator:
- name: whatsapp-web-code

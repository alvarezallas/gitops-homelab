apiVersion: apps/v1
kind: Deployment
metadata:
  name: speakr
  namespace: speakr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: speakr
  template:
    metadata:
      labels:
        app: speakr
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi5
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: speakr
        image: learnedmachine/speakr:0.10.19-alpha-lite@sha256:80bc63c5f704047ec5a9406ff3ad1915b0bd22aeb6c6e60801ddec53e87099be
        imagePullPolicy: IfNotPresent
        command:
        - gunicorn
        args:
        - --workers
        - '1'
        - --worker-class
        - gthread
        - --threads
        - '4'
        - --bind
        - 0.0.0.0:8899
        - --timeout
        - '1800'
        - --no-control-socket
        - src.app:app
        env:
        - name: TZ
          value: Europe/Madrid
        - name: TEXT_MODEL_BASE_URL
          value: https://notas.bearsfamily.es/_pc-ai/v1
        - name: TEXT_MODEL_NAME
          value: qwen3.5:4b
        - name: TEXT_MODEL_EXTRA_BODY
          value: '{"think":false}'
        - name: ALLOW_REGISTRATION
          value: 'false'
        - name: SESSION_COOKIE_SECURE
          value: 'true'
        - name: TRUSTED_PROXY_HOPS
          value: '1'
        - name: TRUSTED_PROXIES
          value: 10.244.0.0/24,10.19.19.163,127.0.0.1
        - name: UPLOAD_FOLDER
          value: /data/uploads
        - name: ENABLE_INQUIRE_MODE
          value: 'true'
        - name: ENABLE_INQUIRE_AGENT
          value: 'false'
        - name: SUMMARY_MAX_TOKENS
          value: '4096'
        - name: CHAT_MAX_TOKENS
          value: '2048'
        - name: TITLE_MAX_TOKENS
          value: '256'
        - name: EVENT_MAX_TOKENS
          value: '1024'
        - name: MAX_CONCURRENT_UPLOADS
          value: '1'
        - name: AUDIO_COMPRESS_UPLOADS
          value: 'true'
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: HF_HUB_DISABLE_TELEMETRY
          value: '1'
        - name: TOKENIZERS_PARALLELISM
          value: 'false'
        - name: OMP_NUM_THREADS
          value: '1'
        - name: OPENBLAS_NUM_THREADS
          value: '1'
        - name: HOME
          value: /data/instance
        - name: XDG_CACHE_HOME
          value: /data/instance/cache
        - name: ENABLE_PUBLIC_SHARING
          value: 'false'
        - name: JOB_QUEUE_WORKERS
          value: '1'
        - name: SUMMARY_QUEUE_WORKERS
          value: '1'
        - name: EMBEDDING_BASE_URL
          value: https://notas.bearsfamily.es/_pc-ai/v1
        - name: EMBEDDING_MODEL
          value: embeddinggemma:300m
        - name: TRANSCRIPTION_CONNECTOR
          value: asr_endpoint
        - name: USE_ASR_ENDPOINT
          value: 'true'
        - name: ASR_BASE_URL
          value: http://127.0.0.1:19000
        - name: ASR_DIARIZE
          value: 'true'
        - name: ASR_RETURN_SPEAKER_EMBEDDINGS
          value: 'false'
        - name: ASR_TIMEOUT
          value: '6000'
        - name: JOB_MAX_RETRIES
          value: '1'
        envFrom:
        - secretRef:
            name: speakr-config
        ports:
        - name: http
          containerPort: 8899
        volumeMounts:
        - name: data
          mountPath: /data
        - name: postgresql-ca
          mountPath: /etc/postgresql-ca
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 1536Mi
            ephemeral-storage: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /login
            port: http
          periodSeconds: 10
          failureThreshold: 60
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /login
            port: http
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 30
          failureThreshold: 5
      - name: asr-proxy
        image: learnedmachine/speakr:0.10.19-alpha-lite@sha256:80bc63c5f704047ec5a9406ff3ad1915b0bd22aeb6c6e60801ddec53e87099be
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -B
        - -c
        - "import http.client\nimport os\nfrom http.server import BaseHTTPRequestHandler,\
          \ ThreadingHTTPServer\nfrom urllib.parse import urlsplit\n\n\nclass Proxy(BaseHTTPRequestHandler):\n\
          \    def do_POST(self):\n        if urlsplit(self.path).path != '/asr':\n\
          \            self.send_error(404)\n            return\n        length =\
          \ self.headers.get('Content-Length', '')\n        if not length.isdecimal()\
          \ or not 0 < int(length) <= 250 * 1024 * 1024:\n            self.send_error(413)\n\
          \            return\n        upstream = http.client.HTTPSConnection('notas.bearsfamily.es',\
          \ timeout=5700)\n        try:\n            upstream.putrequest('POST', '/_pc-ai'\
          \ + self.path)\n            upstream.putheader('Authorization', 'Bearer\
          \ ' + os.environ['ASR_TOKEN'])\n            upstream.putheader('Content-Type',\
          \ self.headers.get('Content-Type', 'application/octet-stream'))\n      \
          \      upstream.putheader('Content-Length', length)\n            upstream.endheaders()\n\
          \            remaining = int(length)\n            while remaining:\n   \
          \             chunk = self.rfile.read(min(remaining, 65536))\n         \
          \       if not chunk:\n                    raise ConnectionError('Incomplete\
          \ upload')\n                upstream.send(chunk)\n                remaining\
          \ -= len(chunk)\n            result = upstream.getresponse()\n         \
          \   body = result.read(32 * 1024 * 1024 + 1)\n            if len(body) >\
          \ 32 * 1024 * 1024:\n                raise ValueError('ASR result too large')\n\
          \        except (OSError, ValueError, http.client.HTTPException):\n    \
          \        self.send_error(502)\n            return\n        finally:\n  \
          \          upstream.close()\n        self.send_response(result.status)\n\
          \        self.send_header('Content-Type', result.getheader('Content-Type',\
          \ 'application/json'))\n        self.send_header('Content-Length', str(len(body)))\n\
          \        self.end_headers()\n        self.wfile.write(body)\n\n    def log_message(self,\
          \ *_):\n        pass\n\n\nThreadingHTTPServer(('127.0.0.1', 19000), Proxy).serve_forever()\n"
        env:
        - name: ASR_TOKEN
          valueFrom:
            secretKeyRef:
              name: speakr-config
              key: TRANSCRIPTION_API_KEY
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: speakr-data
      - name: postgresql-ca
        configMap:
          name: postgresql-ca
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi

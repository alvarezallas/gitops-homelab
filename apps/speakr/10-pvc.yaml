apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speakr-data
  namespace: speakr
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ''
  volumeName: speakr-data-pv
  resources:
    requests:
      storage: 30Gi

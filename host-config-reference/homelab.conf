# Snapshot of nginx sites; canonical source is nginx-sites-available.
map $http_upgrade $homelab_connection { default upgrade; "" close; }
map $http_origin $homelab_qbit_origin {
 default $http_origin;
 "https://qbittorrent.bearsfamily.es" "http://127.0.0.1:30081";
 "https://qbittorrent.bearsfamily.es:443" "http://127.0.0.1:30081";
}
map $http_referer $homelab_qbit_referer {
 default $http_referer;
 "~^https://qbittorrent[.]bearsfamily[.]es(?::443)?(/.*)?$" "http://127.0.0.1:30081$1";
}

server { listen 80; server_name argocd.bearsfamily.es; return 301 https://$host$request_uri; }
server {
 listen 443 ssl; server_name argocd.bearsfamily.es;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_certificate /etc/nginx/tls/bearsfamily.es/current/fullchain.pem;
 ssl_certificate_key /etc/nginx/tls/bearsfamily.es/current/privkey.pem;
 location / {
  proxy_pass https://127.0.0.1:30080; proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $homelab_connection;
  proxy_read_timeout 300;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/nginx/tls/argocd-upstream.crt;
  proxy_ssl_name argocd-server;
  proxy_ssl_server_name on;

 }
}

# Compatibilidad temporal: el certificado .es no cubre .aa.
server { listen 80; server_name argocd.bearsfamily.aa; return 302 https://argocd.bearsfamily.es$request_uri; }
server { listen 443 ssl; server_name argocd.bearsfamily.aa; ssl_certificate /etc/nginx/tls/homelab.crt; ssl_certificate_key /etc/nginx/tls/homelab.key; return 302 https://argocd.bearsfamily.es$request_uri; }

# Validated by Semaphore before publication.
# Portal único del repositorio: welcome.html.
server {
 listen 80 default_server;
 listen [::]:80 default_server;
 server_name bearsfamily.es _;
 return 301 https://bearsfamily.es$request_uri;
}
server {
 listen 443 ssl default_server;
 listen [::]:443 ssl default_server;
 server_name bearsfamily.es _;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_certificate /etc/nginx/tls/bearsfamily.es/current/fullchain.pem;
 ssl_certificate_key /etc/nginx/tls/bearsfamily.es/current/privkey.pem;
 root /var/lib/homelab-nginx/current;
 location = / { try_files /welcome.html =404; }
 location = /welcome.html { try_files $uri =404; }
 location = /assets/bear-development.png { try_files $uri =404; }
 location / { return 404; }
}


 listen 443 ssl;
 server_name wireguard.bearsfamily.es;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_certificate /etc/nginx/tls/bearsfamily.es/current/fullchain.pem;
 ssl_certificate_key /etc/nginx/tls/bearsfamily.es/current/privkey.pem;
 allow 192.168.1.0/24;
 allow 10.244.0.0/24; # pi5 PodCIDR: source of VPN traffic after pod NAT

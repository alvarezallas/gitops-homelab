apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-monitoring-queries
  namespace: databases
data:
  queries.yaml: "homelab_database:\n  query: SELECT datname, pg_database_size(datname)\
    \ AS bytes FROM pg_database WHERE\n    NOT datistemplate\n  metrics:\n  - datname:\n\
    \      usage: LABEL\n      description: Database\n  - bytes:\n      usage: GAUGE\n\
    \      description: Database size in bytes\nhomelab_activity:\n  query: SELECT\
    \ COALESCE(datname,'internal') AS datname, count(*) AS connections,\n    count(*)\
    \ FILTER (WHERE wait_event_type='Lock') AS waiting_locks FROM pg_stat_activity\n\
    \    GROUP BY datname\n  metrics:\n  - datname:\n      usage: LABEL\n      description:\
    \ Database\n  - connections:\n      usage: GAUGE\n      description: Connections\n\
    \  - waiting_locks:\n      usage: GAUGE\n      description: Connections waiting\
    \ for locks\nhomelab_transactions:\n  query: SELECT datname,xact_commit,xact_rollback\
    \ FROM pg_stat_database WHERE datname\n    IS NOT NULL\n  metrics:\n  - datname:\n\
    \      usage: LABEL\n      description: Database\n  - xact_commit:\n      usage:\
    \ COUNTER\n      description: Committed transactions\n  - xact_rollback:\n   \
    \   usage: COUNTER\n      description: Rolled back transactions\n"

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-work
  namespace: dns-filter
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ''
  volumeName: adguard-work-pv
  resources:
    requests:
      storage: 2Gi

apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
  namespace: dns-filter
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: adguard-home
  ports:
  - name: dns-tcp
    port: 53
    targetPort: 5353
    nodePort: 30553
    protocol: TCP
  - name: dns-udp
    port: 53
    targetPort: 5353
    nodePort: 30553
    protocol: UDP

        {
          "id": 32,
          "type": "text",
          "title": "Alcance de las métricas",
          "description": "",
          "gridPos": {
            "x": 12,
            "y": 45,
            "w": 12,
            "h": 7
          },
          "options": {
            "mode": "markdown",
            "content": "**Actualización:** cada 30 s, con tasas promediadas sobre ventanas de muestreo.\n\n**Discos superiores:** raíces `/` de los cuatro nodos. El NAS `.164` está fuera del clúster y no tiene exporter en este dashboard.\n\n**Históricos por pod:** empiezan al activar cAdvisor. CPU/RAM desde contenedores; red excluye `hostNetwork`.\n\n**Disco por pod:** I/O de bloques, no espacio ocupado. Los kubelets actuales no exponen `container_fs_usage_bytes`; tampoco hay medición de capacidad usada del PVC NFS. No se inventan ceros ni capacidades reales a partir de requests.\n\n**Persistencia:** Prometheus conserva 15 días. Panel administrado desde GitOps; namespace/pod solo filtran los paneles históricos."
          }
        }

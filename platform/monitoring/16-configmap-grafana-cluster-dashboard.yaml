apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cluster-dashboard
  namespace: monitoring
data:
  cluster-overview.json: |
    {
      "id": null,
      "uid": "bearsfamily-cluster",
      "title": "Bearsfamily · Estado completo del clúster",
      "description": "Estado absoluto actual de los cuatro nodos e histórico por pod. Gestión GitOps. Sin métricas ficticias; el NAS externo requiere instrumentación independiente.",
      "tags": [
        "homelab",
        "kubernetes",
        "bearsfamily"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "30s",
          "1m",
          "5m"
        ]
      },
      "editable": false,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(kube_pod_info, namespace)",
            "definition": "label_values(kube_pod_info, namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "options": []
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(kube_pod_info{namespace=~\"${namespace:regex}\"}, pod)",
            "definition": "label_values(kube_pod_info{namespace=~\"${namespace:regex}\"}, pod)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "options": []
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "01 · Clúster ahora — valores absolutos, actualización cada 30 s",
          "description": "",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "CPU utilizada · núcleos",
          "description": "Media de 1 minuto: núcleos ocupados; no porcentaje. Incluye espera de I/O, excluye guest para no duplicar.",
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(node_cpu_seconds_total{job=\"nodes\",mode!~\"idle|guest|guest_nice\"}[1m]))",
              "legendFormat": "",
              "range": false,
              "instant": true,
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "cores",
              "decimals": 2,
              "color": {
                "mode": "palette-classic"
              },
              "noValue": "Sin datos"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "wideLayout": true
          }
        },

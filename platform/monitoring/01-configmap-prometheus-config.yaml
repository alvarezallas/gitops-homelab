apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    {
      "global": {
        "scrape_interval": "30s"
      },
      "scrape_configs": [
        {
          "job_name": "prometheus",
          "static_configs": [
            {
              "targets": [
                "localhost:9090"
              ]
            }
          ]
        },
        {
          "job_name": "nodes",
          "static_configs": [
            {
              "targets": [
                "192.168.1.160:9100",
                "192.168.1.161:9100",
                "192.168.1.162:9100",
                "192.168.1.163:9100"
              ]
            }
          ]
        },
        {
          "job_name": "kube-state-metrics",
          "static_configs": [
            {
              "targets": [
                "kube-state-metrics:8080"
              ]
            }
          ]
        },
        {
          "job_name": "kubelet-cadvisor",
          "scheme": "https",
          "scrape_interval": "30s",
          "scrape_timeout": "20s",
          "tls_config": {
            "ca_file": "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          },
          "authorization": {
            "credentials_file": "/var/run/secrets/kubernetes.io/serviceaccount/token"
          },
          "static_configs": [
            {
              "targets": [
                "kubernetes.default.svc:443"
              ],
              "labels": {
                "node": "pi5",
                "instance": "pi5"
              }
            },
            {
              "targets": [
                "kubernetes.default.svc:443"
              ],
              "labels": {
                "node": "pi3b1",
                "instance": "pi3b1"
              }
            },
            {
              "targets": [
                "kubernetes.default.svc:443"
              ],
              "labels": {
                "node": "pi3b2",
                "instance": "pi3b2"
              }
            },
            {
              "targets": [
                "kubernetes.default.svc:443"
              ],
              "labels": {
                "node": "pi3b3",
                "instance": "pi3b3"
              }
            }
          ],
          "relabel_configs": [
            {
              "source_labels": [
                "node"
              ],
              "target_label": "__metrics_path__",
              "replacement": "/api/v1/nodes/${1}/proxy/metrics/cadvisor"
            }
          ],
          "metric_relabel_configs": [
            {
              "source_labels": [
                "__name__"
              ],
              "regex": "container_(cpu_usage_seconds_total|memory_working_set_bytes|network_(receive|transmit)_bytes_total|fs_(reads|writes)_bytes_total)",
              "action": "keep"
            },
            {
              "source_labels": [
                "pod"
              ],
              "regex": ".+",
              "action": "keep"
            }
          ]
        }
      ]
    }

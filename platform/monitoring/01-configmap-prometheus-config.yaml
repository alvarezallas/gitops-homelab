apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: '{"global": {"scrape_interval": "30s"}, "scrape_configs": [{"job_name":
    "prometheus", "static_configs": [{"targets": ["localhost:9090"]}]}, {"job_name":
    "nodes", "static_configs": [{"targets": ["192.168.1.160:9100", "192.168.1.161:9100",
    "192.168.1.162:9100", "192.168.1.163:9100"]}]}, {"job_name": "kube-state-metrics",
    "static_configs": [{"targets": ["kube-state-metrics:8080"]}]}]}'

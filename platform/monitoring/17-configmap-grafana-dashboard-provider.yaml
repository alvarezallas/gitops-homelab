apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: '{"apiVersion": 1, "providers": [{"name": "bearsfamily-cluster", "orgId": 1, "folder": "Homelab",
    "folderUid": "homelab", "type": "file", "disableDeletion": true, "allowUiUpdates": false, "updateIntervalSeconds":
    30, "options": {"path": "/var/lib/grafana/dashboards/bearsfamily"}}]}'

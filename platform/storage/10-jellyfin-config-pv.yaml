apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-config-pv
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 5Gi
  accessModes:
  - ReadWriteOnce
  storageClassName: ''
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: media
    name: jellyfin-config
  local:
    path: /var/lib/homelab-apps/jellyfin/config
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - pi5

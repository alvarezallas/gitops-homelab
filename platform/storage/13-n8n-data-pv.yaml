apiVersion: v1
kind: PersistentVolume
metadata:
  name: n8n-data-pv
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 2Gi
  accessModes:
  - ReadWriteOnce
  storageClassName: ''
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: n8n
    name: n8n-data
  local:
    path: /var/lib/homelab-apps/n8n/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - pi5

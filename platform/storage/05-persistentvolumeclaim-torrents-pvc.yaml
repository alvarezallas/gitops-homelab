apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: torrents-pvc
  namespace: downloads
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: nfs-storage
  volumeName: nfs-pv-12
  resources:
    requests:
      storage: 11Ti

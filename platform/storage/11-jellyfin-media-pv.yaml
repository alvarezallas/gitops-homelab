apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-pv
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 12Ti
  accessModes:
  - ReadOnlyMany
  storageClassName: ''
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: media
    name: jellyfin-media
  mountOptions:
  - nfsvers=4.2
  - hard
  - timeo=600
  - retrans=2
  - ro
  nfs:
    server: 192.168.1.164
    path: /mnt/d12tb/qbittorrent/downloads
    readOnly: true

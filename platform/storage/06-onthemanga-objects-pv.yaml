apiVersion: v1
kind: PersistentVolume
metadata:
  name: onthemanga-objects-pv
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 20Gi
  accessModes:
  - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: nfs-storage
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: onthemanga
    name: onthemanga-objects
  nfs:
    server: 192.168.1.164
    path: /mnt/d01tb/onthemanga-objects
  mountOptions:
  - hard
  - nfsvers=4.1
  - timeo=600
  - retrans=2

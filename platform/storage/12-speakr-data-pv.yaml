apiVersion: v1
kind: PersistentVolume
metadata:
  name: speakr-data-pv
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 30Gi
  accessModes:
  - ReadWriteMany
  storageClassName: ''
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: speakr
    name: speakr-data
  mountOptions:
  - nfsvers=4.2
  - hard
  - timeo=600
  - retrans=2
  nfs:
    server: 192.168.1.164
    path: /mnt/d01tb/speakr

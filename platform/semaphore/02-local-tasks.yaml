apiVersion: v1
kind: ConfigMap
metadata:
  name: semaphore-local-tasks
  namespace: semaphore
data:
  healthcheck.sh: '#!/bin/bash

    set -euo pipefail

    printf ''Homelab: tarea local correcta\n''

    date -Iseconds

    printf ''Zona horaria: %s\n'' "${TZ:-no-definida}"

    printf ''UID: ''; id -u

    printf ''Git: ''; git --version

    printf ''Python: ''; python3 --version

    printf ''Sin cambios en hosts o cluster\n''

    '
  controlled-failure.sh: '#!/bin/bash

    printf ''Fallo controlado para verificar estado y log\n''

    exit 7

    '
  ssh.conf: "Host *\n    StrictHostKeyChecking yes\n    UserKnownHostsFile /home/semaphore/.ssh/known_hosts\n"
  nginx-sync.sh: "#!/bin/bash\nset -euo pipefail\nexec timeout -s TERM -k 10 190 ssh\
    \ -T -F /dev/null \\\n  -i /run/secrets/nginx-ssh/id_ed25519 \\\n  -o IdentitiesOnly=yes\
    \ -o BatchMode=yes \\\n  -o StrictHostKeyChecking=yes \\\n  -o UserKnownHostsFile=/opt/homelab/tasks/pi5_known_hosts\
    \ \\\n  -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=3\
    \ \\\n  -o ClearAllForwardings=yes \\\n  semaphore-nginx@192.168.1.163 deploy-nginx\n"
  pi5_known_hosts: '192.168.1.163 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAySde60TUInn3W3ycgxAlF9nwotl5yoSg26h4+LYcpo

    '

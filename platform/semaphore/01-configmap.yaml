apiVersion: v1
kind: ConfigMap
metadata:
  name: semaphore-config
  namespace: semaphore
data:
  SEMAPHORE_DB_DIALECT: postgres
  SEMAPHORE_DB_HOST: homelab-postgres-rw.databases.svc
  SEMAPHORE_DB_PORT: '5432'
  SEMAPHORE_DB: semaphore
  SEMAPHORE_DB_OPTIONS: '{"sslmode": "verify-full", "sslrootcert": "/etc/semaphore/postgresql-ca/ca.crt"}'
  SEMAPHORE_CONFIG_PATH: /etc/semaphore
  SEMAPHORE_DB_PATH: /var/lib/semaphore
  SEMAPHORE_TMP_PATH: /tmp/semaphore
  SEMAPHORE_WEB_ROOT: https://semaphore.bearsfamily.aa
  TZ: Europe/Madrid
  SEMAPHORE_SCHEDULE_TIMEZONE: Europe/Madrid
  SEMAPHORE_MAX_PARALLEL_TASKS: '1'
  SEMAPHORE_MAX_TASKS_PER_TEMPLATE: '1'
  SEMAPHORE_MAX_TASK_DURATION_SEC: '300'
  SEMAPHORE_ADMIN: admin
  SEMAPHORE_ADMIN_EMAIL: admin@bearsfamily.aa
  SEMAPHORE_ADMIN_NAME: Homelab Admin
  SEMAPHORE_GIT_CLIENT: cmd_git
  PYTHONDONTWRITEBYTECODE: '1'
  HOME: /home/semaphore
  SEMAPHORE_PORT: :3000

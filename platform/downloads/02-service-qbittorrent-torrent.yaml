apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-torrent
  namespace: downloads
spec:
  type: NodePort
  selector:
    app: qbittorrent
  ports:
  - name: tcp
    port: 30881
    targetPort: 30881
    nodePort: 30881
    protocol: TCP
  - name: udp
    port: 30881
    targetPort: 30881
    nodePort: 30881
    protocol: UDP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: downloads
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: pi5
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent@sha256:304b19cf94bf4fda534e0b086cab9c5f1a9e139a8180c05c0ad7d2ba1526fa99
        ports:
        - containerPort: 30081
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1024Mi
        env:
        - name: PUID
          value: '1000'
        - name: PGID
          value: '1000'
        - name: TZ
          value: Europe/Madrid
        - name: WEBUI_PORT
          value: '30081'
        - name: TORRENTING_PORT
          value: '30881'
        volumeMounts:
        - name: data
          mountPath: /config
          subPath: qbittorrent/config
        - name: data
          mountPath: /downloads
          subPath: qbittorrent/downloads
        readinessProbe:
          tcpSocket:
            port: 30081
          initialDelaySeconds: 20
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: torrents-pvc

{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "wireguard-network-policy",
    "namespace": "wireguard"
  },
  "data": {
    "configure.cjs": "// Applies public network policy offline before starting wg-easy. Never outputs keys.\nconst {DatabaseSync}=require('node:sqlite');\nconst fs=require('node:fs');\nconst p='/etc/wireguard/wg-easy.db';\nif(fs.existsSync(p)){\n const db=new DatabaseSync(p);\n if(db.prepare(\"SELECT name FROM sqlite_master WHERE type='table' AND name='hooks_table'\").get()){\n  db.prepare('UPDATE hooks_table SET pre_up=?,post_up=?,pre_down=?,post_down=? WHERE id=?').run('',({\"postUp\": \"iptables -t nat -A POSTROUTING -s {{ipv4Cidr}} -o {{device}} -j MASQUERADE; iptables -A INPUT -i {{interface}} -p icmp -j ACCEPT; iptables -A INPUT -i {{interface}} -j DROP; iptables -N HOMELAB_WG; iptables -A HOMELAB_WG -d 10.8.0.0/24 -j REJECT; iptables -A HOMELAB_WG -d 10.244.0.0/16 -j REJECT; iptables -A HOMELAB_WG -d 10.96.0.0/12 -j REJECT; iptables -A HOMELAB_WG -d 169.254.0.0/16 -j REJECT; iptables -A HOMELAB_WG -j ACCEPT; iptables -A FORWARD -i {{interface}} -j HOMELAB_WG; iptables -A FORWARD -o {{interface}} -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT; ip6tables -A INPUT -i {{interface}} -j DROP; ip6tables -A FORWARD -i {{interface}} -j REJECT --reject-with icmp6-adm-prohibited; ip6tables -A FORWARD -o {{interface}} -j DROP;\", \"postDown\": \"iptables -t nat -D POSTROUTING -s {{ipv4Cidr}} -o {{device}} -j MASQUERADE; iptables -D INPUT -i {{interface}} -p icmp -j ACCEPT; iptables -D INPUT -i {{interface}} -j DROP; iptables -D FORWARD -i {{interface}} -j HOMELAB_WG; iptables -D FORWARD -o {{interface}} -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT; iptables -F HOMELAB_WG; iptables -X HOMELAB_WG; ip6tables -D INPUT -i {{interface}} -j DROP; ip6tables -D FORWARD -i {{interface}} -j REJECT --reject-with icmp6-adm-prohibited; ip6tables -D FORWARD -o {{interface}} -j DROP;\"}).postUp,'',({\"postUp\": \"iptables -t nat -A POSTROUTING -s {{ipv4Cidr}} -o {{device}} -j MASQUERADE; iptables -A INPUT -i {{interface}} -p icmp -j ACCEPT; iptables -A INPUT -i {{interface}} -j DROP; iptables -N HOMELAB_WG; iptables -A HOMELAB_WG -d 10.8.0.0/24 -j REJECT; iptables -A HOMELAB_WG -d 10.244.0.0/16 -j REJECT; iptables -A HOMELAB_WG -d 10.96.0.0/12 -j REJECT; iptables -A HOMELAB_WG -d 169.254.0.0/16 -j REJECT; iptables -A HOMELAB_WG -j ACCEPT; iptables -A FORWARD -i {{interface}} -j HOMELAB_WG; iptables -A FORWARD -o {{interface}} -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT; ip6tables -A INPUT -i {{interface}} -j DROP; ip6tables -A FORWARD -i {{interface}} -j REJECT --reject-with icmp6-adm-prohibited; ip6tables -A FORWARD -o {{interface}} -j DROP;\", \"postDown\": \"iptables -t nat -D POSTROUTING -s {{ipv4Cidr}} -o {{device}} -j MASQUERADE; iptables -D INPUT -i {{interface}} -p icmp -j ACCEPT; iptables -D INPUT -i {{interface}} -j DROP; iptables -D FORWARD -i {{interface}} -j HOMELAB_WG; iptables -D FORWARD -o {{interface}} -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT; iptables -F HOMELAB_WG; iptables -X HOMELAB_WG; ip6tables -D INPUT -i {{interface}} -j DROP; ip6tables -D FORWARD -i {{interface}} -j REJECT --reject-with icmp6-adm-prohibited; ip6tables -D FORWARD -o {{interface}} -j DROP;\"}).postDown,'wg0');\n  db.prepare('UPDATE user_configs_table SET default_mtu=?, default_persistent_keepalive=?, default_allowed_ips=?, default_dns=? WHERE id=?').run(1380,25,JSON.stringify(['0.0.0.0/0','::/0']),JSON.stringify(['192.168.1.163']),'wg0');\n  db.prepare('UPDATE interfaces_table SET mtu=? WHERE name=?').run(1380,'wg0');\n }\n db.close();\n}\n"
  }
}

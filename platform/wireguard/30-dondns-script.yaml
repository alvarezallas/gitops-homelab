{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "dondns-updater",
    "namespace": "wireguard"
  },
  "data": {
    "update.py": "\"\"\"DonDNS HTTPS API client. Never logs credentials, request URLs or provider bodies.\"\"\"\nimport ipaddress,json,os,pathlib,socket,sys,time,urllib.request,urllib.parse,urllib.error\nHOST='vpn.bearsfamily.es'\nclass Failure(Exception):pass\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,req,fp,code,msg,headers,newurl):raise Failure('https_redirect_rejected')\ndef fetch(url):\n try:\n  req=urllib.request.Request(url,headers={'User-Agent':'HomelabDonDNS/1.0','Accept':'application/json,text/plain'})\n  with urllib.request.build_opener(NoRedirect(),urllib.request.ProxyHandler({})).open(req,timeout=10) as r:\n   if r.status!=200:raise Failure('https_bad_status')\n   b=r.read(65537)\n   if len(b)>65536:raise Failure('response_too_large')\n   return b.decode('utf-8')\n except urllib.error.HTTPError as e:raise Failure('https_http_'+str(e.code)) from None\n except Failure:raise\n except Exception:raise Failure('https_request_failed') from None\ndef ipv4(value):\n try:a=ipaddress.ip_address(value.strip())\n except ValueError:raise Failure('invalid_public_ip') from None\n if a.version!=4 or not a.is_global:raise Failure('invalid_public_ip')\n return str(a)\ndef public_ip():\n first=ipv4(fetch('https://api.ipify.org'))\n second=ipv4(fetch('https://checkip.amazonaws.com'))\n if first!=second:raise Failure('public_ip_sources_disagree')\n return first\ndef resolve():\n try:return {x[4][0] for x in socket.getaddrinfo(HOST,None,socket.AF_INET,socket.SOCK_DGRAM)}\n except OSError:return set()\ndef credentials():\n try:\n  p=pathlib.Path(os.environ.get('DONDNS_SECRET_DIR','/run/dondns'))\n  user=(p/'username').read_text().strip();key=(p/'apikey').read_text().strip()\n except OSError:raise Failure('credentials_missing') from None\n if not user or not key:raise Failure('credentials_empty')\n return user,key\ndef update(ip,user,key):\n # Official Bash client and API example use `password` for the DonDNS key.\n query=urllib.parse.urlencode({'user':user,'password':key,'host':HOST,'ip':ip,'lang':'en'})\n try:reply=json.loads(fetch('https://dondns.dondominio.com/json/?'+query))\n except Failure:raise\n except Exception:raise Failure('provider_invalid_json') from None\n if reply.get('success') is not True:\n  messages=reply.get('messages',[])\n  if \"The DNS Zone doesn't exist\" in messages:raise Failure('dns_zone_missing')\n  if 'Incorrect data' in messages:raise Failure('provider_credentials_rejected')\n  raise Failure('provider_rejected_update')\n h=reply.get('host',{})\n if h.get('name','').rstrip('.').lower()!=HOST or h.get('type')!='A' or h.get('value')!=ip:raise Failure('provider_response_mismatch')\n return h.get('updated') is True\ndef main():\n try:\n  user,key=credentials();ip=public_ip()\n  force=os.environ.get('DONDNS_FORCE_UPDATE')=='true'\n  if resolve()=={ip} and not force:result={'status':'unchanged','host':HOST,'ipv4':ip}\n  else:\n   changed=update(ip,user,key)\n   for attempt in range(5):\n    if resolve()=={ip}:break\n    if attempt<4:time.sleep(3)\n   else:raise Failure('dns_not_yet_matching_public_ip')\n   result={'status':'updated' if changed else 'verified','host':HOST,'ipv4':ip}\n  print(json.dumps(result));return 0\n except Failure as e:print(json.dumps({'status':'error','reason':str(e),'host':HOST}));return 1\n except Exception:print(json.dumps({'status':'error','reason':'unexpected_failure','host':HOST}));return 1\nif __name__=='__main__':sys.exit(main())\n"
  }
}

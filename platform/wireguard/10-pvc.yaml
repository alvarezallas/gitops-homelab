{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "wireguard-state",
    "namespace": "wireguard",
    "annotations": {
      "argocd.argoproj.io/sync-options": "Prune=false,Delete=false"
    }
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "storageClassName": "",
    "volumeName": "wireguard-state-pv",
    "resources": {
      "requests": {
        "storage": "1Gi"
      }
    }
  }
}

{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "certbot-manual",
    "namespace": "certificates",
    "annotations": {
      "argocd.argoproj.io/sync-options": "Prune=false,Delete=false"
    }
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app": "certbot-manual"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "certbot-manual"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "enableServiceLinks": false,
        "nodeSelector": {
          "kubernetes.io/hostname": "pi5"
        },
        "tolerations": [
          {
            "key": "node-role.kubernetes.io/control-plane",
            "operator": "Exists",
            "effect": "NoSchedule"
          }
        ],
        "securityContext": {
          "runAsUser": 0,
          "runAsGroup": 0,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "terminationGracePeriodSeconds": 30,
        "containers": [
          {
            "name": "certbot",
            "image": "docker.io/certbot/certbot:v5.9.0@sha256:13c94d8a7f0e135583d44a1574813b2404a936c5ba851897259e130a47777c17",
            "imagePullPolicy": "IfNotPresent",
            "command": [
              "/bin/sh",
              "-c",
              "exec sleep infinity"
            ],
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "512Mi",
                "ephemeral-storage": "128Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "state",
                "mountPath": "/acme"
              },
              {
                "name": "hooks",
                "mountPath": "/opt/acme",
                "readOnly": true
              },
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ],
            "readinessProbe": {
              "exec": {
                "command": [
                  "sh",
                  "-c",
                  "test -w /acme"
                ]
              },
              "periodSeconds": 10
            }
          }
        ],
        "volumes": [
          {
            "name": "state",
            "persistentVolumeClaim": {
              "claimName": "acme-state"
            }
          },
          {
            "name": "hooks",
            "configMap": {
              "name": "certbot-manual-hooks",
              "defaultMode": 365
            }
          },
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "64Mi"
            }
          }
        ]
      }
    }
  }
}

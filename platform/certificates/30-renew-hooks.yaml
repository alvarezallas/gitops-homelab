{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "certbot-renew-hooks",
    "namespace": "certificates"
  },
  "data": {
    "dondominio_hook.py": "#!/usr/bin/env python3\n\"\"\"DNS-01: create dedicated TXT records, remove only records created by this run.\"\"\"\nimport json,os,pathlib,re,sys,time,urllib.request,urllib.parse\nfrom dnscheck import txt_records,write\nDOMAIN='bearsfamily.es';OWNER='_acme-challenge.'+DOMAIN\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,*args,**kwargs):return None\nclass Provider:\n def __init__(self,cfg):self.cfg=cfg\n def call(self,action,**params):\n  assert action in ['tool/hello','service/dnslist','service/dnscreate','service/dnsdelete']\n  body={'apiuser':self.cfg['apiuser'],'apipasswd':self.cfg['apipasswd'],'serviceName':self.cfg.get('serviceName',DOMAIN),**params}\n  req=urllib.request.Request('https://simple-api.dondominio.net/'+action+'/',data=urllib.parse.urlencode(body).encode(),headers={'Content-Type':'application/x-www-form-urlencoded'})\n  try:\n   with urllib.request.build_opener(NoRedirect).open(req,timeout=30) as f:d=json.load(f)\n  except Exception:raise RuntimeError('DonDominio HTTPS/API request failed; credentials not logged') from None\n  if d.get('success') is not True:raise RuntimeError('DonDominio API error code '+str(d.get('errorCode','unknown')))\n  return d.get('responseData',{})\n def records(self):\n  d=self.call('service/dnslist',pageLength=1000,page=1)\n  if int(d.get('queryInfo',{}).get('total',0))>1000:raise RuntimeError('DNS zone too large for this narrowly scoped hook')\n  return d.get('dns',[])\n def create(self,value):\n  d=self.call('service/dnscreate',name=OWNER,type='TXT',value=value,ttl=60)\n  matches=[r for r in d.get('dns',[]) if r.get('name','').rstrip('.')==OWNER and r.get('type')=='TXT' and r.get('value')==value]\n  if len(matches)!=1:raise RuntimeError('Unexpected create response; inspect ACME record privately')\n  return str(matches[0]['entityID'])\n def remove(self,item):\n  for r in self.records():\n   if str(r.get('entityID'))==item['id']:\n    assert r.get('name','').rstrip('.')==OWNER and r.get('type')=='TXT' and r.get('value')==item['value'],'Refusing to delete an unrelated record'\n    self.call('service/dnsdelete',entityID=item['id']);return\ndef main():\n os.umask(0o077);action=sys.argv[1];assert action in ['auth','cleanup']\n domain=os.environ.get('CERTBOT_DOMAIN') or os.environ.get('CERTBOT_IDENTIFIER');assert domain and domain.removeprefix('*.')==DOMAIN\n value=os.environ['CERTBOT_VALIDATION'];assert re.fullmatch(r'[A-Za-z0-9_-]{20,128}',value)\n runid=os.environ['ACME_RUN_ID'];assert re.fullmatch(r'[a-zA-Z0-9-]{1,80}',runid)\n folder=pathlib.Path('/acme/production/dns-api-runs')/runid;folder.mkdir(parents=True,exist_ok=True,mode=0o700);path=folder/'owned.json'\n items=json.loads(path.read_text()) if path.exists() else []\n provider=Provider(json.loads(pathlib.Path('/run/dondominio/credentials.json').read_text()))\n if action=='cleanup':\n  for item in items:\n   if item['value']==value:provider.remove(item)\n  return\n if not any(i['value']==value for i in items):\n  items.append({'value':value,'id':provider.create(value)});write(path,items)\n if int(os.environ.get('CERTBOT_REMAINING_CHALLENGES','0')):return\n expected={i['value'] for i in items};deadline=time.monotonic()+3600\n while time.monotonic()<deadline:\n  if all(expected<=txt_records(OWNER,s) for s in ['1.1.1.1','8.8.8.8']):return\n  time.sleep(15)\n raise RuntimeError('Timed out waiting for public TXT propagation')\nif __name__=='__main__':\n try:main()\n except Exception as exc:\n  print('DNS hook failed: '+str(exc)[:180],file=sys.stderr);sys.exit(1)\n",
    "runner.py": "#!/usr/bin/env python3\n\"\"\"Run Certbot renewal in the cluster; logs stay on the private ACME volume.\"\"\"\nimport os,pathlib,subprocess,uuid,fcntl,json,sys,datetime\nos.umask(0o077);base=pathlib.Path('/acme/production');dry='--dry-run' in sys.argv\nwith (base/'renewal-job.lock').open('w') as lock:\n fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\n runid=uuid.uuid4().hex;env=dict(os.environ,ACME_RUN_ID=runid)\n logdir=base/'automation';logdir.mkdir(mode=0o700,exist_ok=True)\n args=['certbot','renew','--non-interactive','--cert-name','bearsfamily.es','--config-dir',str(base/'config'),'--work-dir',str(base/'work'),'--logs-dir',str(base/'logs'),'--manual-auth-hook','/opt/renew/auth.sh','--manual-cleanup-hook','/opt/renew/cleanup.sh','--no-random-sleep-on-renew']\n if dry:args+=['--dry-run']\n with (logdir/(runid+'.log')).open('w') as log:\n  try:code=subprocess.run(args,env=env,stdout=log,stderr=log,timeout=4500).returncode\n  except subprocess.TimeoutExpired:code=124\n report={'runid':runid,'dry_run':dry,'exit_code':code,'finished_at':datetime.datetime.now(datetime.timezone.utc).isoformat()}\n (logdir/'last-result.json').write_text(json.dumps(report)+'\\n')\n print(json.dumps(report));sys.exit(code)\n",
    "dnscheck.py": "#!/usr/bin/env python3\n\"\"\"Manual DNS publication with automatic checks; no DNS credentials used.\"\"\"\nimport json,os,pathlib,secrets,socket,struct,sys,time\ndef txt_records(name,server):\n ident=secrets.randbelow(65536);packet=struct.pack('!HHHHHH',ident,0x0100,1,0,0,0)+b''.join(bytes([len(x)])+x.encode() for x in name.rstrip('.').split('.'))+b'\\0'+struct.pack('!HH',16,1)\n try:\n  with socket.socket(socket.AF_INET,socket.SOCK_DGRAM) as sock:\n   sock.settimeout(4);sock.sendto(packet,(server,53));data=sock.recvfrom(4096)[0]\n  rid,flags,qd,an,_,_=struct.unpack('!HHHHHH',data[:12])\n  if rid!=ident or flags&15 or flags&0x0200:return set()\n  def skip(pos):\n   for _ in range(128):\n    n=data[pos]\n    if n&0xc0==0xc0:return pos+2\n    pos+=1\n    if not n:return pos\n    pos+=n\n   raise ValueError('Invalid DNS name')\n  pos=12\n  for _ in range(qd):pos=skip(pos)+4\n  values=set()\n  for _ in range(an):\n   pos=skip(pos);typ,cls,ttl,length=struct.unpack('!HHIH',data[pos:pos+10]);pos+=10;end=pos+length\n   if typ==16 and cls==1:\n    p=pos;parts=[]\n    while p<end:n=data[p];p+=1;parts.append(data[p:p+n]);p+=n\n    values.add(b''.join(parts).decode('utf-8'))\n   pos=end\n  return values\n except (OSError,ValueError,IndexError,struct.error,UnicodeError):return set()\ndef write(path,obj):\n tmp=path.with_suffix('.tmp');tmp.write_text(json.dumps(obj,indent=2)+'\\n');tmp.chmod(0o600);tmp.replace(path)\ndef main():\n os.umask(0o077)\n phase=os.environ['ACME_PHASE'];runid=os.environ['ACME_RUN_ID'];assert phase in ['staging','production'] and runid.isalnum()\n base=pathlib.Path('/acme')/phase/'runs'/runid;base.mkdir(parents=True,mode=0o700,exist_ok=True)\n domain=os.environ.get('CERTBOT_DOMAIN') or os.environ.get('CERTBOT_IDENTIFIER');assert domain and domain.removeprefix('*.')=='bearsfamily.es'\n value=os.environ['CERTBOT_VALIDATION'];assert value and len(value)<1024\n request={'type':'TXT','name':'_acme-challenge.bearsfamily.es','host':'_acme-challenge','value':value}\n path=base/'requests.json';items=json.loads(path.read_text()) if path.exists() else []\n if request not in items:items.append(request)\n write(path,items)\n remaining=int(os.environ.get('CERTBOT_REMAINING_CHALLENGES','0'))\n write(base/'status.json',{'phase':phase,'status':'collecting_requests' if remaining else 'waiting_dns','record_count':len(items),'remaining':remaining})\n if remaining:return\n expected={x['value'] for x in items};deadline=time.monotonic()+3600\n while time.monotonic()<deadline:\n  if all(expected<=txt_records(request['name'],server) for server in ['1.1.1.1','8.8.8.8']):\n   write(base/'status.json',{'phase':phase,'status':'dns_verified','record_count':len(items)});return\n  time.sleep(5)\n write(base/'status.json',{'phase':phase,'status':'dns_timeout','record_count':len(items)});raise SystemExit('DNS validation timed out; existing services unchanged')\nif __name__=='__main__':main()\n",
    "auth.sh": "#!/bin/sh\nexec python /opt/renew/dondominio_hook.py auth\n",
    "cleanup.sh": "#!/bin/sh\nexec python /opt/renew/dondominio_hook.py cleanup\n"
  }
}